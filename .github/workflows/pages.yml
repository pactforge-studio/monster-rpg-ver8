name: Validate and publish game
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: deployment
      - name: Read validated source version
        id: source
        run: |
          ref=$(tr -d '\r\n' < deployment/source-ref.txt)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: kankidoi2-byte/monster-rpg-ver8
          ref: ${{ steps.source.outputs.ref }}
          path: game
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare new host and transfer screen
        run: node deployment/scripts/prepare.mjs game
      - name: Validate game and save transfer
        working-directory: game
        run: |
          node scripts/test-url-migration.mjs
          npm run check
      - name: Assemble runtime files
        run: |
          mkdir site
          cp game/index.html game/url-transfer.html site/
          cp -R game/js game/css game/images site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v5
        with:
          path: deployment
      - name: Read source for isolated published-game test
        id: smoke-source
        run: |
          ref=$(tr -d '\r\n' < deployment/source-ref.txt)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: kankidoi2-byte/monster-rpg-ver8
          ref: ${{ steps.smoke-source.outputs.ref }}
          path: game
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated browser for published-game test
        working-directory: game
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify published evolution compensation with isolated saves
        working-directory: game
        env:
          GAME_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/test-evolution-native-card-migration-browser.mjs
          node scripts/test-normal-healing-browser.mjs
      - name: Verify published motion and runtime hashes
        env:
          GAME_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node deployment/scripts/prepare.mjs game
          python3 deployment/scripts/verify-three-motions.py
      - name: Verify published three motion playback with isolated saves
        working-directory: game
        env:
          GAME_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-three-motion-compression-browser.mjs
      - name: Upload published motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-three-motion-evidence
          path: game/artifacts/three-motion-compression
